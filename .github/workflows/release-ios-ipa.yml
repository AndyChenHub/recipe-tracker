name: Build & Auto-Release iOS IPA

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'iOS Distribution Profile (adhoc = direct installable .ipa, production = TestFlight/App Store)'
        required: true
        default: 'adhoc'
        type: choice
        options:
          - adhoc
          - production
      bump:
        description: 'Optional automatic version bump before building (manual trigger only)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      auto_submit_testflight:
        description: 'Auto-submit to TestFlight (only applies when profile = production)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-ios:
    name: Compile Signed iOS IPA & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate (Typecheck + Unit Tests)
        run: |
          npm run typecheck
          npm test

      - name: Optional Version Bump & Tag (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/bump-version.mjs "${{ inputs.bump }}" --git
          git push origin HEAD:main --follow-tags

      - name: Determine Release Tag & Build Profile
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${{ inputs.bump }}" != "none" && -n "${{ inputs.bump }}" ]]; then
            TAG_NAME="v${PKG_VER}"
          else
            TAG_NAME="v${PKG_VER}-build.${GITHUB_RUN_NUMBER}"
          fi

          PROFILE="${{ inputs.profile || 'adhoc' }}"
          SUBMIT_FLAG=""
          if [[ "$PROFILE" == "production" && "${{ inputs.auto_submit_testflight }}" == "true" ]]; then
            SUBMIT_FLAG="--auto-submit"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "submit_flag=${SUBMIT_FLAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Signed iOS .ipa on EAS Cloud
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: |
          eas build \
            --platform ios \
            --profile "${{ steps.meta.outputs.profile }}" \
            --non-interactive \
            --json \
            --wait \
            ${{ steps.meta.outputs.submit_flag }} > eas-build-output.json

          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("eas-build-output.json", "utf8"));
            const build = Array.isArray(raw) ? raw[0] : raw;
            if (!build || !build.artifacts || !build.artifacts.buildUrl) {
              console.error("Missing IPA artifact URL in EAS response:", raw);
              process.exit(1);
            }
            const out = [
              `ipa_url=${build.artifacts.buildUrl}`,
              `build_number=${build.appBuildVersion || "1"}`,
              `app_version=${build.appVersion || "0.1.0"}`,
              `details_url=${build.buildDetailsPageUrl || ""}`
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
          '

      - name: Download Compiled .ipa Artifact
        id: download_ipa
        run: |
          IPA_FILENAME="recipe-tracker-v${{ steps.eas_build.outputs.app_version }}-b${{ steps.eas_build.outputs.build_number }}-${{ steps.meta.outputs.profile }}.ipa"
          curl -fsSL "${{ steps.eas_build.outputs.ipa_url }}" -o "${IPA_FILENAME}"
          ls -lh "${IPA_FILENAME}"
          echo "ipa_file=${IPA_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with Attached .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "Recipe Tracker iOS ${{ steps.meta.outputs.tag_name }} (Build ${{ steps.eas_build.outputs.build_number }})"
          generate_release_notes: true
          files: ${{ steps.download_ipa.outputs.ipa_file }}
          body: |
            ### 📱 iOS Build Ready (`${{ steps.meta.outputs.profile }}`)
            - **Semantic Version:** `v${{ steps.eas_build.outputs.app_version }}`
            - **iOS Build Number (`CFBundleVersion`):** `${{ steps.eas_build.outputs.build_number }}`
            - **OTA Install / QR Page (EAS):** ${{ steps.eas_build.outputs.details_url }}
            - **Direct `.ipa` Binary:** Attached below (`${{ steps.download_ipa.outputs.ipa_file }}`) — install over-the-air via the EAS link above, Apple Configurator, or Xcode Devices.
