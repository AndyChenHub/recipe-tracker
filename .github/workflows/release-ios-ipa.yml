name: Build & Auto-Release iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump before building (manual dispatch)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: ios-ipa-release
  cancel-in-progress: false

jobs:
  release-ios:
    name: Compile Native iOS IPA & Publish Release
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate (Typecheck + Unit Tests)
        run: |
          npm run typecheck
          npm test

      - name: Compute Target Release Version
        id: version
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          NEEDS_MAIN_COMMIT="false"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            APP_VERSION="${TAG_NAME#v}"
            node scripts/bump-version.mjs "${APP_VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bump }}" != "none" && -n "${{ inputs.bump }}" ]]; then
            node scripts/bump-version.mjs "${{ inputs.bump }}"
            APP_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${APP_VERSION}"
            NEEDS_MAIN_COMMIT="true"
          else
            CURRENT_VER=$(node -p "require('./package.json').version")
            if git ls-remote --tags origin "refs/tags/v${CURRENT_VER}" | grep -q .; then
              node scripts/bump-version.mjs patch
              APP_VERSION=$(node -p "require('./package.json').version")
              TAG_NAME="v${APP_VERSION}"
              NEEDS_MAIN_COMMIT="true"
            else
              APP_VERSION="${CURRENT_VER}"
              TAG_NAME="v${APP_VERSION}"
            fi
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "needs_main_commit=${NEEDS_MAIN_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "Target Release: ${TAG_NAME} (Build ${BUILD_NUMBER})"

      - name: Select Latest Xcode Toolchain
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Generate Native iOS Project & Install CocoaPods
        env:
          CI: '1'
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          HAS_P12_CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          npx expo prebuild --platform ios --clean --no-install
          echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

          if [ "$HAS_P12_CERT" != "true" ]; then
            node -e '
              const fs = require("fs");
              const p = "ios/Podfile";
              const src = fs.readFileSync(p, "utf8");
              const snippet = [
                "post_install do |installer|",
                "    installer.pods_project.targets.each do |t|",
                "      t.build_configurations.each do |c|",
                "        c.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"",
                "        c.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"",
                "      end",
                "    end"
              ].join("\n");
              if (!src.includes("post_install do |installer|")) {
                throw new Error("Expected post_install block in generated Podfile");
              }
              fs.writeFileSync(p, src.replace("post_install do |installer|", snippet));
            '
          fi

          which pod || sudo gem install cocoapods --no-document
          cd ios
          pod install

      - name: Compile Release iOS Binary & Package .ipa
        id: build_ipa
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -eo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          IPA_FILENAME="recipe-tracker-${{ steps.version.outputs.tag_name }}-b${{ steps.version.outputs.build_number }}.ipa"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME -> $IPA_FILENAME"

          if [ -n "$CERTIFICATE_P12_BASE64" ] && [ -n "$PROVISIONING_PROFILE_BASE64" ] && [ -n "$TEAM_ID" ]; then
            echo "Apple signing secrets detected — building signed Ad-Hoc .ipa..."
            KEYCHAIN_PASS="ci_temp_keychain_pass_987"
            security create-keychain -p "$KEYCHAIN_PASS" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
            security set-keychain-settings -t 3600 -l build.keychain

            echo "$CERTIFICATE_P12_BASE64" | base64 --decode > cert.p12
            security import cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" build.keychain

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"

            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath ios/build/App.xcarchive \
              DEVELOPMENT_TEAM="$TEAM_ID" 2>&1 | tee xcodebuild.log || {
                grep -E "error:" xcodebuild.log | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done
                exit 1
              }

            node -e '
              const fs = require("fs");
              const teamId = process.env.TEAM_ID;
              const plist = [
                "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
                "<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">",
                "<plist version=\"1.0\"><dict>",
                "  <key>method</key><string>ad-hoc</string>",
                "  <key>teamID</key><string>" + teamId + "</string>",
                "  <key>compileBitcode</key><false/>",
                "</dict></plist>"
              ].join("\n");
              fs.writeFileSync("ios/ExportOptions.plist", plist, "utf8");
            '

            xcodebuild -exportArchive \
              -archivePath ios/build/App.xcarchive \
              -exportPath ios/build/export \
              -exportOptionsPlist ios/ExportOptions.plist

            EXPORTED_IPA=$(ls ios/build/export/*.ipa | head -n 1)
            cp "$EXPORTED_IPA" "./${IPA_FILENAME}"
            SIGNING_MODE="Signed (Ad-Hoc)"

            security delete-keychain build.keychain || true
            rm -f cert.p12 "$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"
          else
            echo "Building native Release ARM64 .ipa..."
            xcodebuild build \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath ios/build \
              CODE_SIGN_IDENTITY="" \
              EXPANDED_CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
                grep -E "error:|fatal error:" xcodebuild.log | tail -n 15 | while IFS= read -r line; do echo "::error::$line"; done
                exit 1
              }

            APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              echo "::error::Compiled .app bundle not found in ios/build/Build/Products/Release-iphoneos"
              exit 1
            fi

            rm -rf build_ipa
            mkdir -p build_ipa/Payload
            cp -R "$APP_PATH" build_ipa/Payload/
            (cd build_ipa && zip -qry "../${IPA_FILENAME}" Payload)
            SIGNING_MODE="Unsigned Release Binary (Sign & install with your Apple Dev Account via Sideloadly / AltStore / SideStore / Xcode)"
          fi

          ls -lh "${IPA_FILENAME}"
          echo "ipa_file=${IPA_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${SIGNING_MODE}" >> "$GITHUB_OUTPUT"

      - name: Commit Version Bump & Push Release Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.version.outputs.needs_main_commit }}" = "true" ]; then
            git add package.json app.json CHANGELOG.md
            git commit -m "chore(release): ${{ steps.version.outputs.tag_name }} [skip ci]"
            git push origin HEAD:main
          fi

          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            git tag -f "${{ steps.version.outputs.tag_name }}"
            git push -f origin "${{ steps.version.outputs.tag_name }}"
          fi

      - name: Upload .ipa Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_ipa.outputs.ipa_file }}
          path: ${{ steps.build_ipa.outputs.ipa_file }}
          retention-days: 30

      - name: Publish GitHub Release with .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "Recipe Tracker iOS ${{ steps.version.outputs.tag_name }} (Build ${{ steps.version.outputs.build_number }})"
          generate_release_notes: true
          files: ${{ steps.build_ipa.outputs.ipa_file }}
          body: |
            ### 📱 Recipe Tracker iOS Release `${{ steps.version.outputs.tag_name }}`
            - **Version:** `v${{ steps.version.outputs.app_version }}`
            - **iOS Build (`CFBundleVersion`):** `${{ steps.version.outputs.build_number }}`
            - **Package Mode:** ${{ steps.build_ipa.outputs.signing_mode }}

            #### Installing on Your iPhone (from Windows with Your Apple Dev Account)
            1. Download **`${{ steps.build_ipa.outputs.ipa_file }}`** attached below.
            2. Open **Sideloadly** (or **AltStore / SideStore**) on Windows, connect your iPhone (USB or Wi-Fi), drop in the `.ipa`, sign in with your Apple Developer Apple ID, and click **Start** — with a paid Apple Developer account, the certificate stays valid for a full **365 days**!
            *(Optional: Add `IOS_CERTIFICATE_P12_BASE64`, `IOS_CERTIFICATE_PASSWORD`, `IOS_PROVISIONING_PROFILE_BASE64`, and `IOS_TEAM_ID` in GitHub Actions Secrets to pre-sign `.ipa` builds directly in CI).*
